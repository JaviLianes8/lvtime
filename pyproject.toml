[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lvtime"
version = "1.0.0"
description = "Lossless LabVIEW 128-bit timestamp (1904 epoch) to and from datetime, UTC, sub-microsecond preserved."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = [
    "labview",
    "timestamp",
    "datetime",
    "tdms",
    "national-instruments",
    "1904",
    "epoch",
    "flatten",
    "decimal",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
lvtime = "lvtime._cli:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "build", "twine"]

[project.urls]
Homepage = "https://github.com/JaviLianes8/lvtime"
Source = "https://github.com/JaviLianes8/lvtime"
Documentation = "https://github.com/JaviLianes8/lvtime/blob/main/GUIDE.md"
Issues = "https://github.com/JaviLianes8/lvtime/issues"
Changelog = "https://github.com/JaviLianes8/lvtime/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.wheel]
packages = ["src/lvtime"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/lvtime",
    "tests",
    "README.md",
    "GUIDE.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
# The fetched vendor and upstream references are test-side copies only; they are not distributed.
exclude = ["**/__pycache__", "**/*.pyc", "tests/fixtures/sources/*.html", "tests/fixtures/sources/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
